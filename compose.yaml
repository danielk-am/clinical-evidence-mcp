name: clinical-evidence-mcp

services:
  clinical-evidence-mcp:
    build:
      context: .
      dockerfile: Dockerfile
    image: clinical-evidence-mcp:local
    container_name: clinical-evidence-mcp
    restart: unless-stopped
    environment:
      HOST: 0.0.0.0
      PORT: 3946
      DATA_DIR: /data
      MCP_PUBLIC_URL: https://${MCP_DOMAIN:-clinical-evidence-mcp.danielk.am}
      MCP_ALLOWED_ORIGINS: ${MCP_ALLOWED_ORIGINS:-https://claude.ai}
      REQUESTS_PER_MINUTE: ${REQUESTS_PER_MINUTE:-60}
      UPSTREAM_TIMEOUT_MS: ${UPSTREAM_TIMEOUT_MS:-20000}
      NCBI_EMAIL: ${NCBI_EMAIL:-}
      NCBI_API_KEY: ${NCBI_API_KEY:-}
      SYNDICATED_SOURCE_NAME: ${SYNDICATED_SOURCE_NAME:-}
      SYNDICATED_SOURCE_URL: ${SYNDICATED_SOURCE_URL:-}
      SYNDICATED_SOURCE_TOKEN: ${SYNDICATED_SOURCE_TOKEN:-}
      SYNDICATED_SOURCE_ALLOWED_ACCOUNT_IDS: ${SYNDICATED_SOURCE_ALLOWED_ACCOUNT_IDS:-}
      SYNDICATED_SOURCE_TIMEOUT_MS: ${SYNDICATED_SOURCE_TIMEOUT_MS:-200000}
      SYNDICATED_SOURCE_LOGIN_PROXY_URL: ${SYNDICATED_SOURCE_LOGIN_PROXY_URL:-}
    volumes:
      - clinical-evidence-data:/data
    networks:
      - coolify
      - clinical-evidence-private
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    labels:
      traefik.enable: "true"
      traefik.docker.network: coolify
      traefik.http.routers.clinical-evidence-mcp-http.entrypoints: http
      traefik.http.routers.clinical-evidence-mcp-http.rule: Host(`${MCP_DOMAIN:-clinical-evidence-mcp.danielk.am}`)
      traefik.http.routers.clinical-evidence-mcp-http.middlewares: redirect-to-https
      traefik.http.routers.clinical-evidence-mcp-https.entrypoints: https
      traefik.http.routers.clinical-evidence-mcp-https.rule: Host(`${MCP_DOMAIN:-clinical-evidence-mcp.danielk.am}`)
      traefik.http.routers.clinical-evidence-mcp-https.tls: "true"
      traefik.http.routers.clinical-evidence-mcp-https.tls.certresolver: letsencrypt
      traefik.http.services.clinical-evidence-mcp.loadbalancer.server.port: "3946"

networks:
  coolify:
    external: true
  clinical-evidence-private:
    name: clinical-evidence-private
    internal: true

volumes:
  clinical-evidence-data:
